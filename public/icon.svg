  <rect x="128" y="340" width="256" height="10" rx="3" fill="#7c5d46"/>
  <!-- Lighthouse tower -->
  <polygon points="218,342 232,192 280,192 294,342" fill="#f7f3eb"/>
  <polygon points="256,192 280,192 294,342 256,342" fill="#e2dacb"/>
  <!-- Gallery deck -->
  <rect x="212" y="182" width="88" height="14" rx="4" fill="#c93b2b"/>
  <!-- Lantern room -->
  <rect x="230" y="138" width="52" height="44" fill="#fff2b8"/>
  <rect x="230" y="138" width="52" height="44" fill="none" stroke="#c93b2b" stroke-width="6"/>
  <line x1="256" y1="138" x2="256" y2="182" stroke="#c93b2b" stroke-width="4"/>
  <!-- Crimson conical roof & finial -->
  <polygon points="216,140 256,94 296,140" fill="#c93b2b"/>
  <circle cx="256" cy="88" r="8" fill="#f5b841"/>
  <!-- Tower door & windows -->
