<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="58%" stop-color="#1e4b6e"/>
      <stop offset="100%" stop-color="#e39a54"/>
    </linearGradient>
    <linearGradient id="beamL" x1="1" y1="0.5" x2="0" y2="0.5">
      <stop offset="0%" stop-color="#ffe799" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe799" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamR" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#ffe799" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe799" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>
  <!-- Light beams -->
  <polygon points="256,162 40,100 40,218" fill="url(#beamL)"/>
  <polygon points="256,162 472,100 472,218" fill="url(#beamR)"/>
  <!-- Lake Michigan horizon -->
  <path d="M0 364 Q128 346 256 364 T512 364 L512 512 L0 512 Z" fill="#103452"/>
  <path d="M0 398 Q128 384 256 398 T512 398 L512 512 L0 512 Z" fill="#0b2338"/>
